{{ define "main" }}
  <article class="mx-auto max-w-5xl pt-10 pb-16">
    <header class="mb-10">
      <h1 class="mt-0 text-4xl font-extrabold text-neutral-900 dark:text-neutral">{{ .Title | emojify }}</h1>
      {{ with .Description }}<p class="mt-3 text-lg text-neutral-600 dark:text-neutral-300">{{ . }}</p>{{ end }}
    </header>

    {{ with .Params.links }}
      <section class="not-prose grid grid-cols-1 gap-5 sm:grid-cols-2" aria-label="友链列表">
        {{ range . }}
          <a href="{{ .website }}" target="_blank" rel="noopener noreferrer"
             class="group flex items-center gap-4 rounded-2xl border border-cyan-700/15 bg-white/85 p-5 shadow-lg shadow-slate-900/5 backdrop-blur-md transition hover:-translate-y-1 hover:border-cyan-500/40 hover:shadow-cyan-900/10 dark:border-cyan-300/15 dark:bg-slate-900/70 dark:shadow-black/20">
            <img src="{{ .image }}" alt="{{ .title }}" loading="lazy" referrerpolicy="no-referrer"
                 class="h-16 w-16 shrink-0 rounded-full border border-neutral-200 bg-white object-cover shadow-sm dark:border-neutral-700">
            <span class="min-w-0">
              <strong class="block truncate text-xl text-slate-900 transition group-hover:text-cyan-700 dark:text-slate-100 dark:group-hover:text-cyan-300">{{ .title }}</strong>
              <span class="mt-1 block text-sm leading-6 text-slate-600 dark:text-slate-300">{{ .description }}</span>
              <span class="mt-1 block truncate text-xs text-slate-400 dark:text-slate-500">{{ .website }}</span>
            </span>
          </a>
        {{ end }}
      </section>
    {{ end }}

    {{ with .Content }}
      <section class="prose mt-12 max-w-none dark:prose-invert">{{ . }}</section>
    {{ end }}
  </article>
{{ end }}
