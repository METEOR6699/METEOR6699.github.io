colorScheme = "burufugu"
defaultAppearance = "dark"
autoSwitchAppearance = false
enableSearch = true
enableCodeCopy = true
mainSections = ["post"]
disableImageOptimization = false
fingerprintAlgorithm = "sha512"
defaultFeaturedImage = "images/covers/privacy-computing.png"
defaultBackgroundImage = "images/site-background.png"
backgroundCanvas = true
thumbnailAspectRatio = "1.777"
highlightCurrentMenuArea = true
smartTOC = true
smartTOCHideUnfocusedChildren = false

[header]
  layout = "floating"
  mobileMenuStyle = "dropdown"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "background"
  showRecent = true
  showRecentItems = 9
  showMoreLink = true
  showMoreLinkDest = "/post/"
  cardView = true
  cardViewScreenWidth = false
  layoutBackgroundBlur = true

[article]
  showDate = true
  showDateUpdated = true
  showAuthor = true
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true
  layoutBackgroundBlurStyle = "fade"
  layoutBackgroundHeaderSpace = true
  showBreadcrumbs = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showReadingProgress = true
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 6
  showTaxonomies = true
  showCategories = true
  showTags = true
  showWordCount = true
  showZenMode = true

[list]
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true
  layoutBackgroundHeaderSpace = false
  showSummary = false
  showCards = true
  groupByYear = false
  cardView = true
  constrainItemsWidth = false

[taxonomy]
  showTermCount = true
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true
  cardView = true

[term]
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true
  showTableOfContents = true
  groupByYear = false
  cardView = true

[seo]
  metaDescriptionOrder = ["description", "summary", "site"]
